<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Reservations | Steampunk Bulldog Bento Bar</title>
  <link rel="icon" type="image/png" href="favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>

<body class="reservation-page">

<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="index.html">
      <img src="images/logo.png" alt="Steampunk Bulldog logo" class="logo me-2">
      Steampunk Bulldog
    </a>

    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNavigation"
            aria-label="Open navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNavigation">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
        <li class="nav-item"><a class="nav-link active" href="reservations.html">Reservations</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container page-content">
  <section class="content-panel">
    <p class="eyebrow">Plan your visit</p>
    <h1>Make a Reservation</h1>

    <div id="formMessage" class="form-message" aria-live="polite"></div>

    <form id="reservationForm" novalidate>
      <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input type="text" id="name" class="form-control">
        <div class="error-message" id="nameError"></div>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" class="form-control">
        <div class="error-message" id="emailError"></div>
      </div>

      <div class="mb-3">
        <label for="partySize" class="form-label">Party size</label>
        <select id="partySize" class="form-select">
          <option value="">Choose a party size</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
        </select>
        <div class="error-message" id="partySizeError"></div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="date" class="form-label">Date</label>
          <input type="date" id="date" class="form-control">
          <div class="error-message" id="dateError"></div>
        </div>

        <div class="col-md-6 mb-3">
          <label for="time" class="form-label">Time</label>
          <input type="time" id="time" class="form-control">
          <div class="error-message" id="timeError"></div>
        </div>
      </div>

      <fieldset class="mb-3">
        <legend class="h6">Seating preference</legend>

        <div class="form-check">
          <input class="form-check-input" type="radio" name="seating" id="indoor" value="Indoor">
          <label class="form-check-label" for="indoor">Indoor</label>
        </div>

        <div class="form-check">
          <input class="form-check-input" type="radio" name="seating" id="outdoor" value="Outdoor">
          <label class="form-check-label" for="outdoor">Outdoor</label>
        </div>

        <div class="form-check">
          <input class="form-check-input" type="radio" name="seating" id="airshipDeck" value="Airship deck">
          <label class="form-check-label" for="airshipDeck">Airship deck</label>
        </div>

        <div class="error-message" id="seatingError"></div>
      </fieldset>

      <div class="mb-3">
        <label for="dietaryNotes" class="form-label">
          Dietary notes
        </label>
        <textarea id="dietaryNotes" class="form-control" rows="3"></textarea>
        <div class="error-message" id="dietaryNotesError"></div>
      </div>

      <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" id="newsletter">
        <label class="form-check-label" for="newsletter">
          Sign me up for restaurant news
        </label>
      </div>

      <button type="submit" class="btn btn-primary me-2">Submit</button>
      <button type="reset" class="btn btn-secondary">Reset</button>
    </form>
  </section>
</main>

<footer class="site-footer">
  <div class="container text-center">
    <p class="mb-0">© 2026 Steampunk Bulldog Bento Bar</p>
  </div>
</footer>

<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
