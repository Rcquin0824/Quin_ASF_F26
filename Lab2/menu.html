<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Steampunk Bulldog Bento bar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="styles.css" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="index.html">
      <img src="images/logo.png" alt="Logo" class="logo me-2">
      <span>Steampunk Bulldog</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain" aria-controls="navMain" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link active" href="menu.html">Menu</a></li>
        <li class="nav-item"><a class="nav-link" href="reservations.html">Reservations</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container my-5">
  <header class="mb-4">
    <h1>Our Menu</h1>
    <p class="text-muted">Carefully prepared bentos for every shift. Prices shown in USD.</p>
  </header>

  <!-- Controls: category filter -->
  <div class="mb-4 d-flex gap-2 flex-wrap">
    <button class="btn btn-outline-primary btn-sm filter-btn active" data-category="All">All</button>
    <button class="btn btn-outline-primary btn-sm filter-btn" data-category="Breakfast">Breakfast</button>
    <button class="btn btn-outline-primary btn-sm filter-btn" data-category="Lunch">Lunch</button>
    <button class="btn btn-outline-primary btn-sm filter-btn" data-category="Dinner">Dinner</button>
  </div>

  <!-- Menu cards grid -->
  <div id="menuGrid" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
    <!-- Cards inserted by script.js -->
  </div>
</main>

<footer class="bg-dark text-light py-3">
  <div class="container text-center small">
    © Steampunk Bulldog Bento Bar
  </div>
</footer>

<!-- Bootstrap JS bundle (CDN) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

<!-- App script -->
<script src="script.js"></script>
</body>
</html>
